<!-- app/sections/services/services.html -->
<section id="services" class="border-b border-border py-24 lg:py-32">
    <div class="mx-auto max-w-[1440px] px-5 lg:px-10">

        <!-- Header -->
        <div class="grid gap-8 lg:grid-cols-[1fr_1fr]">

            <div>
                <app-section-label number="02" label="Capabilities" />

                <h2 class="mt-6 text-5xl font-black sm:text-6xl">
                    What We Do
                </h2>
            </div>

            <p class="max-w-xl self-end text-lg leading-relaxed text-muted-foreground">
                We design smarter systems, streamline complex operations, and create
                technology strategies built for growth.
            </p>

        </div>

        <!-- Services Grid -->
        <div class="mt-16 grid pt-1 border-l border-t border-border lg:grid-cols-3">

            @for (service of services; track service.number) {
            <article
                class="group flex min-h-96 flex-col justify-between border-b border-r border-border p-7 transition-all duration-300 hover:-translate-y-1 hover:border-primary hover:bg-card lg:p-9">

                <div class="flex items-start justify-between">
                    <span class="text-6xl font-black text-primary">
                        {{ service.number }}
                    </span>
                </div>

                <!-- Content -->
                <div>

                    <div class="mb-6 h-px w-10 bg-primary transition-all group-hover:w-full"></div>

                    <h3 class="text-2xl font-bold">
                        {{ service.title }}
                    </h3>

                    <p class="mt-4 leading-relaxed text-muted-foreground">
                        {{ service.text }}
                    </p>

                </div>

            </article>
            }

        </div>

    </div>
</section>
