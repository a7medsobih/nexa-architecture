<section id="contact" class="relative overflow-hidden border-b border-border py-24 technical-grid lg:py-36">
    <!-- Decorative Architecture Shape -->
    <div aria-hidden="true"
        class="absolute right-[-5%] top-1/2 hidden aspect-square w-[38%] -translate-y-1/2 rotate-45 border border-primary/40 lg:block">
        <div class="absolute inset-[18%] border border-border"></div>
        <div class="absolute inset-[36%] bg-primary"></div>
    </div>

    <div class="relative mx-auto max-w-[1440px] px-5 lg:px-10">
        <app-section-label number="04" label="Start a Conversation" />

        <h2 class="mt-8 max-w-5xl text-5xl font-black leading-[.95] sm:text-7xl lg:text-8xl">
            Ready to Turn Complexity Into
            <span class="text-primary">Clarity?</span>
        </h2>

        <p class="mt-8 max-w-2xl text-xl text-muted-foreground">
            Let's build a smarter foundation for your next stage of growth.
        </p>

        <a href="mailto:hello@nexaarchitecture.com"
            class="mt-10 inline-flex h-16 items-center justify-center gap-3 bg-primary px-8 text-sm font-bold text-primary-foreground transition-transform hover:-translate-y-1">
            Book a Strategy Call
            <lucide-icon [img]="arrowUpRight" [size]="18" />
        </a>

        <p class="mt-7 text-sm text-muted-foreground">
            Contact Us —
            <a class="text-foreground transition-colors hover:text-primary" href="mailto:hello@nexaarchitecture.com">
                hello@nexaarchitecture.com
            </a>
        </p>
    </div>
</section>
