<footer class="bg-background">
    <div class="mx-auto max-w-[1440px] px-5 py-10 lg:px-10">

        <div class="grid gap-10 md:grid-cols-[1fr_auto] md:items-start">

            <!-- Brand -->
            <div class="flex items-center gap-3">
                <span class="grid size-8 place-items-center border border-primary text-xs font-black text-primary">
                    N
                </span>

                <span class="text-sm font-bold uppercase">
                    Nexa Architecture
                </span>
            </div>

            <!-- Navigation -->
            <nav class="flex flex-wrap gap-x-7 gap-y-3">
                @for (item of navItems; track item.href) {
                <a [href]="item.href" class="text-xs text-muted-foreground hover:text-primary">
                    {{ item.label }}
                </a>
                }
            </nav>

        </div>

        <!-- Copyright -->
        <div class="mt-10 border-t border-border pt-6 text-center text-[10px] uppercase text-muted-foreground">
            <span>
                © 2026
                <a href="https://ahmedsobih-portfolio.vercel.app/" target="_blank" rel="noopener noreferrer"
                    class="text-primary">
                    Ahmed Sobih
                </a>
                . All rights reserved.
            </span>
        </div>

    </div>
</footer>
